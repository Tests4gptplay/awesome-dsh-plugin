description:
  en: "Analyze multi-site online and local video with timestamped frames, audio, captions and speech transcription. Supports exact and multi-frame sampling, audio-only requests, full requested audio ranges, DSH-compatible image delivery, resumed viewing, encrypted browser-session import and cache export. Requires FFmpeg and ffprobe on PATH or configured in settings."
  zh: "让 DSH AI 结合时间戳画面、音频、字幕与语音转写分析多站在线视频和本地视频，支持精确时间点、多帧及纯音频请求、完整音频区间、原生图片附件适配、接续观看、加密登录态导入和缓存提取。需要 FFmpeg 与 ffprobe，可放入 PATH 或在设置中指定。"
