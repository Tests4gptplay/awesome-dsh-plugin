description:
  en: "Video Vision helps DSH AI analyze multi-site online and local video with timestamped frames, audio analysis, platform subtitles and recognizer-backed transcription, plus continued viewing, reusable site methods, browser-session import, cache refresh and export. Requires FFmpeg and ffprobe on PATH or configured in the plugin settings."
  zh: "Video Vision 让 DSH 中的 AI 结合时间戳画面、音频分析、平台字幕与识别器转写理解多个网站和本地视频，支持接续观看、复用站点解析方法、浏览器登录态导入、缓存刷新与提取保存。需要把 FFmpeg 与 ffprobe 放进 PATH，或在插件设置中填写程序路径。"
