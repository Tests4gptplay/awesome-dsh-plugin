description:
  en: "Kujira is a DSH plugin combining AI desktop pets, model integration, usage and billing monitoring, role-playing (RP), and personalized memory. It supports account information queries across multiple model providers, model switching, Windows/Linux/macOS platform support, shared world lore, user habit capture, independent personas, personality organization, AI diaries, and sleep consolidation. See the guide for each system's installation requirements. Diaries and consolidation consume tokens. Before installing or updating, we recommend closing visible desktop pets and bubbles; open files may cause installation to fail. Codex and OpenAI API account queries have been user-validated; other sources await user validation and feedback."
  zh: "Kujira 是集 AI 桌宠、模型联动、用量与计费监控、角色扮演（RP）和个性化记忆于一体的 DSH 插件。支持多家模型服务的账户信息查询、模型切换、Windows/Linux/macOS 三平台适配，以及共享世界观、用户习惯捕捉、独立人设、个性整理、AI 日记与睡眠整理。各系统安装要求见使用说明。日记和整理消耗 Token。安装或更新前，建议先关闭桌面上已显示的桌宠和提示气泡；未关闭时，文件占用有可能导致安装失败。Codex 与 OpenAI API 已获用户验证；其他来源待用户验证反馈。"
