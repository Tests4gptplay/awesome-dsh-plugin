description:
  en: "Model-linked DSH personas with shared world lore and preferences, plus separate personalities, guidance and memories editable through conversation. AI diaries, idle-time consolidation and a task-aware companion are independently optional; personas work without the companion. The pet runs in-page or in a Windows x64 native window. Balance/plan data depends on provider interfaces; diaries and consolidation use model tokens. Includes foreground work status and session work statistics. Before installation or updates, choose Close All in the visible pet or bubble context menu to avoid file locks."
  zh: "随 DSH 当前模型切换的角色人设，保存共同世界观、通用偏好及各角色独立的性格、行为要求与记忆；可通过对话编辑和调整绑定。可分别开启 AI 日记、空闲时整理和任务联动桌宠，关闭桌宠仍可使用人设。桌宠支持页面内显示和 Windows x64 原生窗口；余额／套餐信息依接入提供的接口，日记与整理会消耗模型 Token。提供前台工作状态与会话工作统计。安装或更新前，在可见桌宠或气泡的右键菜单选择“全部关闭”，避免文件占用。"
